name: Deploy

# Continuous deployment to Cloudflare Workers. This runs only after the `CI` workflow (lint ·
# typecheck · test · build + e2e) has finished *successfully* for a push to `main` — so a red main
# never ships. It deploys the same `apps/game` Worker + `GameRoom` Durable Object that `wrangler
# deploy` builds locally.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  — the target account id
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Never let two deploys race; if a newer one is queued, it waits for the current to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # Only ship when the CI run we are reacting to actually passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @flipside/game build

      - name: Deploy
        run: pnpm --filter @flipside/game exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
